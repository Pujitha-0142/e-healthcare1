<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Health Care Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 500px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0077cc;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 12px;
            margin-top: 20px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>e-Health Care Registration</h2>
        <form id="healthForm">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" required>

            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="">--Select Gender--</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label for="doctor">Choose Doctor</label>
            <select id="doctor" name="doctor" required>
                <option value="">--Select Doctor--</option>
                <option>Dr. Smith - General Physician</option>
                <option>Dr. Patel - Cardiologist</option>
                <option>Dr. Lee - Dermatologist</option>
                <option>Dr. Sharma - Neurologist</option>
            </select>

            <label for="appointment">Appointment Date</label>
            <input type="date" id="appointment" name="appointment" required>

            <button type="submit">Book Appointment</button>
        </form>
    </div>

    <script>
        document.getElementById('healthForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent page reload

            const name = document.getElementById('fullname').value;
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            const doctor = document.getElementById('doctor').value;
            const date = document.getElementById('appointment').value;

            if (name && age && gender && doctor && date) {
                alert(`Appointment booked successfully!\n\nName: ${name}\nDoctor: ${doctor}\nDate: ${date}`);
            } else {
                alert("Please fill in all fields.");
            }
        });
    </script>
</body>
</html>
